<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QNX 8.0 Codelab — Zero Hardware on Apple Silicon (Docker + QEMU + IPC & Resource Manager)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --sidebar: #f1f5f9;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #475569;
      --accent: #0284c7;
      --accent-soft: #e0f2fe;
      --emerald: #059669;
      --emerald-soft: #d1fae5;
      --warn-bg: #fffbeb;
      --warn-border: #f59e0b;
      --code-bg: #0b1220;
      --code-text: #e2e8f0;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, monospace;
    }
    html.dark {
      --bg: #060a11;
      --surface: #0c1320;
      --sidebar: #09101c;
      --border: #1d2a40;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #22d3ee;
      --accent-soft: rgba(34,211,238,0.14);
      --emerald: #34d399;
      --emerald-soft: rgba(16,185,129,0.16);
      --warn-bg: rgba(245,158,11,0.1);
      --warn-border: #f59e0b;
      --code-bg: #050911;
      --code-text: #e2e8f0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
    }
    /* Header matching QNX / Google Codelabs ergonomics */
    .cl-header {
      position: sticky;
      top: 0;
      z-index: 30;
      height: 60px;
      padding: 0 22px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .cl-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .cl-badge {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      background: var(--accent-soft);
      color: var(--accent);
      white-space: nowrap;
    }
    .cl-title {
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cl-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .cl-btn {
      font-family: var(--font-sans);
      font-size: 12.5px;
      font-weight: 600;
      padding: 6px 11px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .cl-btn:hover { border-color: var(--accent); color: var(--accent); }
    .cl-btn.primary {
      background: var(--accent);
      color: #04101a;
      border-color: var(--accent);
      font-weight: 700;
    }
    /* Layout */
    .cl-layout {
      display: grid;
      grid-template-columns: 290px minmax(0, 1fr);
      min-height: calc(100vh - 60px);
    }
    @media (max-width: 900px) {
      .cl-layout { grid-template-columns: 1fr; }
      .cl-sidebar { border-right: none; border-bottom: 1px solid var(--border); }
    }
    /* Sidebar */
    .cl-sidebar {
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      padding: 18px 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .progress-box {
      padding: 10px 12px;
      border-radius: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 12px;
    }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .progress-track {
      height: 6px;
      border-radius: 999px;
      background: var(--border);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--emerald), var(--accent));
      transition: width 0.25s ease;
    }
    .step-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .step-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid transparent;
      font-size: 13px;
      color: var(--muted);
      transition: all 0.15s;
    }
    .step-item:hover { background: var(--surface); color: var(--text); }
    .step-item.active {
      background: var(--surface);
      border-color: var(--accent);
      color: var(--text);
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .step-num {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-family: var(--font-mono);
      font-size: 11.5px;
      font-weight: 700;
      flex-shrink: 0;
      background: var(--border);
      color: var(--muted);
    }
    .step-item.active .step-num { background: var(--accent); color: #04101a; }
    .step-item.done .step-num { background: var(--emerald); color: #04101a; }
    .step-dur {
      margin-left: auto;
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--muted);
    }
    /* Main content */
    .cl-main {
      padding: 32px 40px 80px;
      max-width: 920px;
      width: 100%;
      margin: 0 auto;
    }
    @media (max-width: 720px) {
      .cl-main { padding: 20px 16px 64px; }
    }
    .step-kicker {
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--accent);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 700;
    }
    .cl-main h1 {
      margin: 6px 0 16px;
      font-size: 28px;
      line-height: 1.25;
      letter-spacing: -0.02em;
    }
    .cl-main h2 {
      margin: 26px 0 10px;
      font-size: 18px;
    }
    .cl-main p, .cl-main li { font-size: 14.5px; color: var(--text); }
    .callout {
      padding: 13px 16px;
      border-radius: 8px;
      margin: 16px 0;
      border-left: 4px solid var(--accent);
      background: var(--accent-soft);
      font-size: 13.5px;
    }
    .callout.warn {
      border-left-color: var(--warn-border);
      background: var(--warn-bg);
    }
    .callout.tip {
      border-left-color: var(--emerald);
      background: var(--emerald-soft);
    }
    .code-wrap {
      position: relative;
      margin: 14px 0 18px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--code-bg);
    }
    .code-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 12px;
      background: rgba(255,255,255,0.04);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      font-family: var(--font-mono);
      font-size: 11px;
      color: #94a3b8;
    }
    .copy-btn {
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 3px 9px;
      border-radius: 5px;
      border: 1px solid rgba(148,163,184,0.3);
      background: transparent;
      color: #e2e8f0;
      cursor: pointer;
    }
    .copy-btn:hover { border-color: #22d3ee; color: #22d3ee; }
    pre {
      margin: 0;
      padding: 14px 16px;
      overflow-x: auto;
      font-family: var(--font-mono);
      font-size: 12.5px;
      line-height: 1.55;
      color: var(--code-text);
    }
    code:not(pre code) {
      font-family: var(--font-mono);
      font-size: 12.5px;
      padding: 2px 5px;
      border-radius: 4px;
      background: var(--accent-soft);
      color: var(--accent);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0;
      font-size: 13px;
    }
    th, td {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
    }
    th {
      font-family: var(--font-mono);
      font-size: 11.5px;
      text-transform: uppercase;
      color: var(--muted);
      background: var(--sidebar);
    }
    .bench-compare {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin: 16px 0;
    }
    @media (max-width: 680px) { .bench-compare { grid-template-columns: 1fr; } }
    .bench-box {
      padding: 14px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
    }
    .bench-box.bad { border-color: #ef4444; }
    .bench-box.good { border-color: var(--emerald); }
    .bench-num {
      font-family: var(--font-mono);
      font-size: 26px;
      font-weight: 800;
      margin: 6px 0;
    }
    .cl-footer {
      margin-top: 36px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
  </style>
</head>
<body>
  <header class="cl-header">
    <div class="cl-brand">
      <span class="cl-badge">QNX 8.0 CODELAB</span>
      <span class="cl-title" id="header-title">Zero Hardware on Apple Silicon: Build &amp; Visualize QNX 8.0 Microkernel IPC</span>
    </div>
    <div class="cl-actions">
      <a class="cl-btn" href="../">⚡ <span data-i18n="openStudio">Open Live Studio</span></a>
      <a class="cl-btn" href="https://github.com/pan609/qnx-pulse-studio" target="_blank" rel="noreferrer">GitHub</a>
      <button class="cl-btn" id="btn-lang">中文</button>
      <button class="cl-btn" id="btn-theme">🌙 Dark</button>
    </div>
  </header>

  <div class="cl-layout">
    <aside class="cl-sidebar">
      <div class="progress-box">
        <div class="progress-meta">
          <span id="prog-label">Progress</span>
          <span id="prog-count">1 / 9 · 30–60 min</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="prog-fill" style="width: 12.5%"></div>
        </div>
      </div>
      <ol class="step-list" id="step-list"></ol>
    </aside>

    <main class="cl-main">
      <div id="step-content"></div>
      <footer class="cl-footer">
        <button class="cl-btn" id="btn-prev">← Previous</button>
        <span id="step-indicator" style="font-family: var(--font-mono); font-size: 12px; color: var(--muted);"></span>
        <button class="cl-btn primary" id="btn-next">Next Step →</button>
      </footer>
    </main>
  </div>

  <script>
    const STEPS = [{"dur": "2 min", "en": {"title": "Overview & What You Will Build", "html": "<p>Build a zero-hardware QNX OS 8.0 development workflow on Apple Silicon: cross-compile with the Linux SDK in a container, boot QNX aarch64le in QEMU TCG, then inspect scheduling and IPC in a browser.</p><p>Three explicit modes: recorded QNX capture (read-only), live target, and synthetic browser simulation. E2E response time and wakeup interval jitter have separate statistical buckets.</p><img src=\"../assets/recorded-studio.png\" alt=\"Recorded QNX OS trace displayed in Studio\" style=\"width:100%;border-radius:10px\"><p>Expected duration: 30–60 minutes after downloads and license activation. Download and account waits vary.</p><div class=\"callout tip\"><strong>Verify Checkpoint</strong><div class=\"code-wrap\"><div class=\"code-head\"><span>Host shell</span><button class=\"copy-btn\">Copy</button></div><pre><code>uname -m</code></pre></div><p>arm64 (Apple Silicon host; Linux host output can differ)</p></div>"}, "zh": {"title": "总览：零硬件在 Apple Silicon 上玩转 QNX 8.0", "html": "<p>在 Apple Silicon 上完成零硬件 QNX OS 8.0 开发：容器内交叉编译、QEMU TCG 启动 aarch64le 目标、浏览器观测调度与 IPC。</p><p>明确区分只读实测回放、在线目标与合成模拟实验。E2E 响应时间与唤醒间隔抖动独立统计。</p><img src=\"../assets/recorded-studio.png\" alt=\"QNX 实测轨迹回放界面\" style=\"width:100%;border-radius:10px\"><p>下载和授权完成后预计需 30–60 分钟；账号审核与下载耗时另计。</p><div class=\"callout tip\"><strong>校验点 / Verify Checkpoint</strong><div class=\"code-wrap\"><div class=\"code-head\"><span>Host shell</span><button class=\"copy-btn\">Copy</button></div><pre><code>uname -m</code></pre></div><p>arm64 (Apple Silicon host; Linux host output can differ)</p></div>"}}, {"dur": "4 min", "en": {"title": "Claim Free QNX Everywhere (SDP 8.0) License", "html": "\n            <p>QNX offers a perpetual, no-charge non-commercial license for QNX SDP 8.0 to hobbyists, students, and hackathon builders.</p>\n            <ol>\n              <li>Create a free myQNX account at <code>https://www.qnx.com/getqnx</code>. <strong>Tip:</strong> The tested signup flow accepted an alphanumeric password. Follow the requirements currently shown by myQNX.</li>\n              <li>Return to <code>https://www.qnx.com/products/everywhere/</code> while logged in, accept the <strong>QNX Development License Agreement (QDL 2.0)</strong>, and submit.</li>\n              <li>Open <code>https://www.qnx.com/account/dashboard/</code> (myQNX License Manager), click <strong>Accept License</strong>, click <strong>Users → Deploy</strong>, and assign the seat to your own myQNX email address.</li>\n              <li>Download <strong>QNX Software Center 2.0.4 (Linux 64-bit Hosts)</strong> (<code>qnx-setup-2.0.4-*-linux.run</code>) from <code>https://www.qnx.com/download/group.html?programid=29178</code>.</li>\n            </ol>\n            <div class=\"callout warn\">\n              <strong>Important:</strong> You MUST complete <em>Accept License</em> and <em>Deploy to your own email</em> in License Manager before the CLI can download QNX SDP 8.0 packages.\n            </div>\n          <div class=\"callout tip\"><strong>Verify Checkpoint</strong><div class=\"code-wrap\"><div class=\"code-head\"><span>Host shell</span><button class=\"copy-btn\">Copy</button></div><pre><code>test -f &quot;$QSC_INSTALLER&quot; &amp;&amp; echo &quot;QSC installer exists&quot;</code></pre></div><p>Installer existence only. Manually confirm Accepted + Deployed in myQNX; never print the license key.</p></div>"}, "zh": {"title": "免费申请 QNX Everywhere 非商用永久授权", "html": "\n            <p>通过 QNX Everywhere 计划，个人开发者、学生及黑客松参赛者可免费获取 QNX SDP 8.0 永久非商用授权。</p>\n            <ol>\n              <li>访问 <code>https://www.qnx.com/getqnx</code> 注册免费 myQNX 账号（⚠️ <strong>避坑</strong>：本次注册使用了字母数字组合；具体要求以官网提示为准）。</li>\n              <li>登录后回到 <code>https://www.qnx.com/products/everywhere/</code>，勾选同意非商用协议（QDL 2.0）并提交。</li>\n              <li>打开 License Manager（<code>https://www.qnx.com/account/dashboard/</code>），点击 <strong>Accept License</strong>，再点 <strong>Users → Deploy</strong> 把授权分配给你自己的邮箱。</li>\n              <li>前往 <code>https://www.qnx.com/download/group.html?programid=29178</code> 下载 Linux 64 位安装包 <code>qnx-setup-2.0.4-*-linux.run</code>。</li>\n            </ol>\n            <div class=\"callout warn\">\n              <strong>关键提醒：</strong>必须在 License Manager 中完成 Accept + Deploy 到自己邮箱，否则命令行工具无法拉取 SDP 8.0 软件包。\n            </div>\n          <div class=\"callout tip\"><strong>校验点 / Verify Checkpoint</strong><div class=\"code-wrap\"><div class=\"code-head\"><span>Host shell</span><button class=\"copy-btn\">Copy</button></div><pre><code>test -f &quot;$QSC_INSTALLER&quot; &amp;&amp; echo &quot;QSC installer exists&quot;</code></pre></div><p>Installer existence only. Manually confirm Accepted + Deployed in myQNX; never print the license key.</p></div>"}}, {"dur": "4 min", "en": {"title": "Prepare Apple Silicon Host (Colima + Rosetta 2 + QEMU)", "html": "\n            <p>Instead of fighting heavy desktop virtualization GUIs, we pair <strong>Colima</strong> (using Apple's native <code>Virtualization.framework</code> + <code>Rosetta 2</code> to run x86_64 Linux QNX compilers at Rosetta translation) with native Homebrew <strong>QEMU</strong>:</p>\n            <div class=\"code-wrap\"><div class=\"code-head\"><span>zsh (macOS host)</span><button class=\"copy-btn\">Copy</button></div><pre><code>brew install colima qemu\ncolima start --cpu 4 --memory 4 --disk 30 --vm-type=vz --vz-rosetta\ndocker context use colima\n\n# Verify QEMU 10+ and Rosetta x86_64 support\nqemu-system-aarch64 --version\ndocker run --rm --platform linux/amd64 ubuntu:22.04 uname -m\n# Expected: x86_64</code></pre></div>\n            <p>Clone the QNX Pulse Studio repository:</p>\n            <div class=\"code-wrap\"><div class=\"code-head\"><span>zsh</span><button class=\"copy-btn\">Copy</button></div><pre><code>git clone https://github.com/pan609/qnx-pulse-studio.git\ncd qnx-pulse-studio</code></pre></div>\n          <div class=\"callout tip\"><strong>Verify Checkpoint</strong><div class=\"code-wrap\"><div class=\"code-head\"><span>Host shell</span><button class=\"copy-btn\">Copy</button></div><pre><code>docker run --rm --platform linux/amd64 ubuntu:22.04 uname -m</code></pre></div><p>x86_64 (the SDK container architecture, not the QNX guest)</p></div>"}, "zh": {"title": "配置 Apple Silicon 宿主机（Colima + Rosetta 2 + QEMU）", "html": "\n            <p>为了摆脱厚重的 GUI 虚拟机，我们在 Mac 上使用 <strong>Colima</strong>（基于 Apple 原生 <code>vz</code> + <code>Rosetta 2</code> 转译运行 x86_64 Linux 版 QNX 编译器）配合原生 <strong>QEMU</strong>：</p>\n            <div class=\"code-wrap\"><div class=\"code-head\"><span>zsh (macOS 宿主机)</span><button class=\"copy-btn\">Copy</button></div><pre><code>brew install colima qemu\ncolima start --cpu 4 --memory 4 --disk 30 --vm-type=vz --vz-rosetta\ndocker context use colima\n\n# 验证 QEMU 与 Rosetta x86_64 生效\nqemu-system-aarch64 --version\ndocker run --rm --platform linux/amd64 ubuntu:22.04 uname -m\n# 预期输出: x86_64</code></pre></div>\n            <p>克隆本教程配套代码仓库：</p>\n            <div class=\"code-wrap\"><div class=\"code-head\"><span>zsh</span><button class=\"copy-btn\">Copy</button></div><pre><code>git clone https://github.com/pan609/qnx-pulse-studio.git\ncd qnx-pulse-studio</code></pre></div>\n          <div class=\"callout tip\"><strong>校验点 / Verify Checkpoint</strong><div class=\"code-wrap\"><div class=\"code-head\"><span>Host shell</span><button class=\"copy-btn\">Copy</button></div><pre><code>docker run --rm --platform linux/amd64 ubuntu:22.04 uname -m</code></pre></div><p>x86_64 (the SDK container architecture, not the QNX guest)</p></div>"}}, {"dur": "5 min", "en": {"title": "Headless QNX SDP 8.0 & QEMU VirtIO Package Install", "html": "\n            <p>Never embed your myQNX password inside a <code>Dockerfile</code>. Our <code>scripts/setup-qnx-sdp.sh</code> extracts QSC 2.0.4 inside an x86_64 Ubuntu container and installs QNX SDP 8.0 cleanly into a persistent host folder (<code>~/qnx-env</code>):</p>\n            <div class=\"code-wrap\"><div class=\"code-head\"><span>zsh</span><button class=\"copy-btn\">Copy</button></div><pre><code>export QNX_USER=\"your-email@example.com\"\nexport QNX_PASSWORD=\"your-myqnx-password\"\nexport QSC_INSTALLER=\"$HOME/Downloads/qnx-setup-2.0.4-202501021438-linux.run\"\n\n./scripts/setup-qnx-sdp.sh</code></pre></div>\n            <h2>Three Critical QSC CLI Gotchas Solved by This Script</h2>\n            <ol>\n              <li><strong>Persist <code>/root/.qnx</code>:</strong> Always mount <code>-v \"$HOME/qnx-env/qnx-dot:/root/.qnx\"</code> into every container run, otherwise <code>qcc</code> fails with <code>license check failed</code>.</li>\n              <li><strong>Mirror Before Listing:</strong> Running <code>-listAccessible</code> before <code>-mirrorBaseline qnx800</code> crashes with <code>\"allrepos\" is null</code>.</li>\n              <li><strong>Install QEMU VirtIO Packages:</strong> Base <code>com.qnx.qnx800</code> omits <code>startup-qemu-virt</code> and <code>devb-virtio</code>! Our script installs all three required packages automatically:</li>\n            </ol>\n            <div class=\"code-wrap\"><div class=\"code-head\"><span>Inside setup-qnx-sdp.sh</span><button class=\"copy-btn\">Copy</button></div><pre><code>qnxsoftwarecenter_clt -myqnx.user \"$QNX_USER\" -myqnx.password \"$QNX_PASSWORD\" -syncLicenseKeys -activateAll\nqnxsoftwarecenter_clt -myqnx.user \"$QNX_USER\" -myqnx.password \"$QNX_PASSWORD\" -mirrorBaseline qnx800\nqnxsoftwarecenter_clt -myqnx.user \"$QNX_USER\" -myqnx.password \"$QNX_PASSWORD\"   -installBaseline com.qnx.qnx800 -destination /opt/qnx-host/qnx800 -cleanInstall\nqnxsoftwarecenter_clt -myqnx.user \"$QNX_USER\" -myqnx.password \"$QNX_PASSWORD\"   -installPackage com.qnx.qnx800.target.qemuvirt,com.qnx.qnx800.target.driver.virtio,com.qnx.qnx800.target.net.devsvirtio   -destination /opt/qnx-host/qnx800</code></pre></div>\n          <div class=\"callout tip\"><strong>Verify Checkpoint</strong><div class=\"code-wrap\"><div class=\"code-head\"><span>Host shell</span><button class=\"copy-btn\">Copy</button></div><pre><code>test -f &quot;$HOME/qnx-env/qnx800/qnxsdp-env.sh&quot; &amp;&amp; echo &quot;SDK environment exists&quot;</code></pre></div><p>SDK environment exists. Actual compiler/license verification occurs at build-target.sh; existence alone is not activation proof.</p></div>"}, "zh": {"title": "无头安装 QNX SDP 8.0 与 QEMU VirtIO 驱动包", "html": "\n            <p>切忌把账号密码写进 <code>Dockerfile</code>！我们的 <code>scripts/setup-qnx-sdp.sh</code> 会在运行时把 SDP 8.0 安全安装到宿主机持久化目录（<code>~/qnx-env</code>）：</p>\n            <div class=\"code-wrap\"><div class=\"code-head\"><span>zsh</span><button class=\"copy-btn\">Copy</button></div><pre><code>export QNX_USER=\"your-email@example.com\"\nexport QNX_PASSWORD=\"your-myqnx-password\"\nexport QSC_INSTALLER=\"$HOME/Downloads/qnx-setup-2.0.4-202501021438-linux.run\"\n\n./scripts/setup-qnx-sdp.sh</code></pre></div>\n            <h2>脚本已帮你绕过的 3 个真实 QSC 命令行大坑</h2>\n            <ol>\n              <li><strong>必须持久化挂载 <code>/root/.qnx</code></strong>：否则后续运行 <code>qcc</code> 会报错 <code>license check failed</code>。</li>\n              <li><strong>必须先 <code>-mirrorBaseline qnx800</code></strong>：否则直接查包会报错 <code>Cannot read the array length because \"allrepos\" is null</code>。</li>\n              <li><strong>必须补装 3 个 QEMU VirtIO 目标包</strong>：基础 <code>com.qnx.qnx800</code> 不包含 <code>startup-qemu-virt</code> 和 <code>devb-virtio</code> 磁盘驱动，脚本会自动补全：</li>\n            </ol>\n            <div class=\"code-wrap\"><div class=\"code-head\"><span>setup-qnx-sdp.sh 核心命令</span><button class=\"copy-btn\">Copy</button></div><pre><code>qnxsoftwarecenter_clt -myqnx.user \"$QNX_USER\" -myqnx.password \"$QNX_PASSWORD\" -syncLicenseKeys -activateAll\nqnxsoftwarecenter_clt -myqnx.user \"$QNX_USER\" -myqnx.password \"$QNX_PASSWORD\" -mirrorBaseline qnx800\nqnxsoftwarecenter_clt -myqnx.user \"$QNX_USER\" -myqnx.password \"$QNX_PASSWORD\"   -installBaseline com.qnx.qnx800 -destination /opt/qnx-host/qnx800 -cleanInstall\nqnxsoftwarecenter_clt -myqnx.user \"$QNX_USER\" -myqnx.password \"$QNX_PASSWORD\"   -installPackage com.qnx.qnx800.target.qemuvirt,com.qnx.qnx800.target.driver.virtio,com.qnx.qnx800.target.net.devsvirtio   -destination /opt/qnx-host/qnx800</code></pre></div>\n          <div class=\"callout tip\"><strong>校验点 / Verify Checkpoint</strong><div class=\"code-wrap\"><div class=\"code-head\"><span>Host shell</span><button class=\"copy-btn\">Copy</button></div><pre><code>test -f &quot;$HOME/qnx-env/qnx800/qnxsdp-env.sh&quot; &amp;&amp; echo &quot;SDK environment exists&quot;</code></pre></div><p>SDK environment exists. Actual compiler/license verification occurs at build-target.sh; existence alone is not activation proof.</p></div>"}}, {"dur": "3 min", "en": {"title": "Build & Boot Genuine QNX 8.0 (aarch64le) on macOS QEMU", "html": "\n            <p>Generate the bootable QNX 8.0 IFS (<code>ifs.bin</code>) and virtual disk (<code>disk-qemu.vmdk</code>) with an embedded passwordless SSH key, then boot directly on macOS:</p>\n            <div class=\"code-wrap\"><div class=\"code-head\"><span>zsh</span><button class=\"copy-btn\">Copy</button></div><pre><code>./scripts/build-qnx-image.sh\n./scripts/run-qemu-macos.sh</code></pre></div>\n            <div class=\"callout warn\">\n              <strong>Apple Silicon macOS Breakthroughs:</strong>\n              <ul>\n                <li>QNX's stock <code>mkqnximage --run</code> disables networking on macOS (<code>Networking not supported</code>). Our script uses QEMU user-mode NAT (<code>-netdev user,hostfwd=tcp::8022-:22,hostfwd=tcp::8080-:8080</code>) so <code>vtnet0</code> gets DHCP automatically and exposes SSH + HTTP on <code>localhost</code>.</li>\n                <li>Passing <code>-accel hvf</code> on Apple Silicon forces GICv3 without a memory-mapped GICC base, tripping <code>gic_v3.c:966 -- ASSERT</code> inside <code>startup-qemu-virt</code>. Booting with <code>-M virt-7.2 -cpu cortex-a76</code> (GICv2) boots QNX 8.0 cleanly in under 10 seconds!</li>\n                <li>QEMU <code>virtio-mmio</code> slots MUST be passed in exact order: <code>virtio-blk-device</code> (0xa003e00) → <code>virtio-net-device</code> (0xa003c00) → <code>virtio-rng-device</code> (0xa003a00).</li>\n              </ul>\n            </div>\n            <p>Inside QNX you will see:</p>\n            <div class=\"code-wrap\"><div class=\"code-head\"><span>QNX 8.0 Serial Console</span><button class=\"copy-btn\">Copy</button></div><pre><code>Startup complete\nQNX noname 8.0.0 2026/10/30-09:09:47EDT QEMU_virt aarch64le</code></pre></div>\n          <div class=\"callout tip\"><strong>Verify Checkpoint</strong><div class=\"code-wrap\"><div class=\"code-head\"><span>Host shell</span><button class=\"copy-btn\">Copy</button></div><pre><code>ssh -i &quot;$HOME/qnx-env/qnx_id_ed25519&quot; -p 8022 root@127.0.0.1 uname -a</code></pre></div><p>QNX noname 8.0.0 ... QEMU_virt aarch64le (observed output; build timestamp varies)</p></div>"}, "zh": {"title": "构建镜像并在 macOS QEMU 上点亮真机 QNX 8.0", "html": "\n            <p>一键生成含免密 SSH 公钥的 QNX 8.0 启动镜像（<code>ifs.bin</code> + <code>disk-qemu.vmdk</code>），然后在 macOS 宿主机直接拉起：</p>\n            <div class=\"code-wrap\"><div class=\"code-head\"><span>zsh</span><button class=\"copy-btn\">Copy</button></div><pre><code>./scripts/build-qnx-image.sh\n./scripts/run-qemu-macos.sh</code></pre></div>\n            <div class=\"callout warn\">\n              <strong>Apple Silicon 独家 3 大突破：</strong>\n              <ul>\n                <li>官方 <code>mkqnximage --run</code> 在 macOS 上直接禁用网络（提示 <code>Networking not supported</code>）；我们的脚本改用 <code>-netdev user,hostfwd=tcp::8022-:22,hostfwd=tcp::8080-:8080</code>，让 <code>vtnet0</code> 自动拿 DHCP 并无缝映射 SSH 与 HTTP 到本机。</li>\n                <li>在 Apple Silicon 上开 <code>-accel hvf</code> 会强制 GICv3 且缺内存映射 GICC 基址，触发 QNX 内核 <code>gic_v3.c:966 ASSERT</code> 断言崩溃；改用官方 <code>-M virt-7.2 -cpu cortex-a76</code>（GICv2）10 秒内丝滑开机！</li>\n                <li><code>virtio-mmio</code> 设备顺序必须严格匹配 QNX <code>startup.sh</code>：<code>virtio-blk</code> → <code>virtio-net</code> → <code>virtio-rng</code>。</li>\n              </ul>\n            </div>\n            <p>几秒后串口将输出：</p>\n            <div class=\"code-wrap\"><div class=\"code-head\"><span>QNX 8.0 串口输出</span><button class=\"copy-btn\">Copy</button></div><pre><code>Startup complete\nQNX noname 8.0.0 2026/10/30-09:09:47EDT QEMU_virt aarch64le</code></pre></div>\n          <div class=\"callout tip\"><strong>校验点 / Verify Checkpoint</strong><div class=\"code-wrap\"><div class=\"code-head\"><span>Host shell</span><button class=\"copy-btn\">Copy</button></div><pre><code>ssh -i &quot;$HOME/qnx-env/qnx_id_ed25519&quot; -p 8022 root@127.0.0.1 uname -a</code></pre></div><p>QNX noname 8.0.0 ... QEMU_virt aarch64le (observed output; build timestamp varies)</p></div>"}}, {"dur": "4 min", "en": {"title": "Inside the QNX 8.0 Resource Manager (/dev/pulse_scope)", "html": "\n            <p>Unlike monolithic kernels where drivers live in kernel space, QNX runs drivers and telemetry servers as isolated user-space <strong>Resource Managers</strong> communicating over native Message Passing IPC.</p>\n            <p>In <code>qnx-target/src/pulse_scope_resmgr.c</code>, we combine four signature QNX 8.0 APIs:</p>\n            <div class=\"code-wrap\"><div class=\"code-head\"><span>qnx-target/src/pulse_scope_resmgr.c</span><button class=\"copy-btn\">Copy</button></div><pre><code>/* 1. QNX 8.0 fine-grained ability awareness */\nprocmgr_ability(0,\n    PROCMGR_ADN_ROOT | PROCMGR_AOP_ALLOW | PROCMGR_AID_PATHSPACE,\n    PROCMGR_ADN_ROOT | PROCMGR_AOP_ALLOW | PROCMGR_AID_XPROCESS_QUERY,\n    PROCMGR_AID_EOL);\n\n/* 2. Hardware CNTVCT_EL0 cycle counter without kernel trap */\nuint64_t cps = SYSPAGE_ENTRY(qtime)->cycles_per_sec;\nuint64_t ns  = (ClockCycles() / cps) * 1000000000ULL +\n               ((ClockCycles() % cps) * 1000000000ULL) / cps;\n\n/* 3. Attach /dev/pulse_scope into global QNX pathname space */\nresmgr_attach(dpp, &amp;rattr, \"/dev/pulse_scope\", _FTYPE_ANY,\n              0, &amp;connect_funcs, &amp;io_funcs, &amp;attr);\n\n/* 4. Live /proc/&lt;pid&gt;/as thread introspection (effective vs base prio!) */\nprocfs_status st = { .tid = 1 };\nwhile (devctl(fd, DCMD_PROC_TIDSTATUS, &amp;st, sizeof(st), NULL) == EOK) {\n    /* st.priority reflects live Priority Inheritance boost; st.real_priority is base */\n}</code></pre></div>\n            <div class=\"callout\">\n              <strong>QNX 8.0 Migration Note:</strong> Compared to QNX 7.1, <code>&lt;sys/states.h&gt;</code> removed <code>STATE_STACK</code> and <code>STATE_WAITTHREAD</code>, while <code>debug_thread_info64</code> exposes both <code>priority</code> and <code>real_priority</code>.\n            </div>\n          <div class=\"callout tip\"><strong>Verify Checkpoint</strong><div class=\"code-wrap\"><div class=\"code-head\"><span>Host shell</span><button class=\"copy-btn\">Copy</button></div><pre><code>curl -fsS -X POST http://127.0.0.1:8080/api/devctl -d &quot;&quot;</code></pre></div><p>After deployment in the next step: JSON with total_cycles, avg_e2e_us and scope. User-space server responds through POSIX read().</p></div><p>Snapshot commands require the three services from Step 7 to be running. Thread scan: scope=lab | all | pid:&lt;N&gt;; bounded to 48 threads total, 16 per process. A non-atomic sample may miss brief states. E2E counters always describe the built-in lab, even when inspecting another PID.</p>"}, "zh": {"title": "剖析 QNX 8.0 自定义资源管理器（/dev/pulse_scope）", "html": "\n            <p>与 Linux 宏内核不同，QNX 把设备驱动与系统服务都放在相互隔离的用户态进程里，称为 <strong>Resource Manager（资源管理器）</strong>，通过微内核消息传递提供标准 POSIX 文件接口。</p>\n            <p>在 <code>qnx-target/src/pulse_scope_resmgr.c</code> 中，我们深度融合了 4 项标志性 QNX 8.0 API：</p>\n            <div class=\"code-wrap\"><div class=\"code-head\"><span>qnx-target/src/pulse_scope_resmgr.c</span><button class=\"copy-btn\">Copy</button></div><pre><code>/* 1. QNX 8.0 细粒度安全能力声明 */\nprocmgr_ability(0,\n    PROCMGR_ADN_ROOT | PROCMGR_AOP_ALLOW | PROCMGR_AID_PATHSPACE,\n    PROCMGR_ADN_ROOT | PROCMGR_AOP_ALLOW | PROCMGR_AID_XPROCESS_QUERY,\n    PROCMGR_AID_EOL);\n\n/* 2. 直接读取硬件计时器 CNTVCT_EL0，零内核陷阱 */\nuint64_t cps = SYSPAGE_ENTRY(qtime)->cycles_per_sec;\nuint64_t ns  = (ClockCycles() / cps) * 1000000000ULL +\n               ((ClockCycles() % cps) * 1000000000ULL) / cps;\n\n/* 3. 将 /dev/pulse_scope 挂载到全局命名空间 */\nresmgr_attach(dpp, &amp;rattr, \"/dev/pulse_scope\", _FTYPE_ANY,\n              0, &amp;connect_funcs, &amp;io_funcs, &amp;attr);\n\n/* 4. 通过 /proc/&lt;pid&gt;/as 实时读取每个线程的有效优先级与微内核状态 */\nprocfs_status st = { .tid = 1 };\nwhile (devctl(fd, DCMD_PROC_TIDSTATUS, &amp;st, sizeof(st), NULL) == EOK) {\n    /* st.priority 为有效优先级，st.real_priority 为基础优先级 */\n    st.tid++; /* required to advance the /proc thread scan */\n}</code></pre></div>\n            <div class=\"callout\">\n              <strong>QNX 8.0 升级实测细节：</strong>相比 QNX 7.1，QNX 8.0 的 <code>&lt;sys/states.h&gt;</code> 移除了 <code>STATE_STACK</code> 与 <code>STATE_WAITTHREAD</code>，而 <code>debug_thread_info64</code> 同时暴露 <code>priority</code> 与 <code>real_priority</code>。\n            </div>\n          <div class=\"callout tip\"><strong>校验点 / Verify Checkpoint</strong><div class=\"code-wrap\"><div class=\"code-head\"><span>Host shell</span><button class=\"copy-btn\">Copy</button></div><pre><code>curl -fsS -X POST http://127.0.0.1:8080/api/devctl -d &quot;&quot;</code></pre></div><p>After deployment in the next step: JSON with total_cycles, avg_e2e_us and scope. User-space server responds through POSIX read().</p></div><p>Snapshot commands require the three services from Step 7 to be running. Thread scan: scope=lab | all | pid:&lt;N&gt;; bounded to 48 threads total, 16 per process. A non-atomic sample may miss brief states. E2E counters always describe the built-in lab, even when inspecting another PID.</p>"}}, {"dur": "4 min", "en": {"title": "Cross-Compile & Deploy the Priority Inversion Lab", "html": "\n            <p>Our 3-stage real-time lab (<code>qnx-target/src/ipc_lab_workload.c</code>) runs <code>sensor_rt_loop (SCHED_FIFO P30)</code> → <code>controller_srv (P25)</code> → <code>actuator_srv (P20)</code> driven by a 20 Hz <code>SIGEV_PULSE</code> timer, alongside <code>low_calib_worker (P15)</code> and <code>med_cpu_hog (P24)</code> pinned to CPU 0 using QNX's native <code>ThreadCtl(_NTO_TCTL_RUNMASK, (void *)0x1)</code>.</p>\n            <div class=\"code-wrap\"><div class=\"code-head\"><span>zsh (Cross-compile + hot deploy to QEMU QNX 8.0)</span><button class=\"copy-btn\">Copy</button></div><pre><code>./scripts/build-target.sh\n./scripts/deploy-to-qnx.sh\n\n# Verify live QNX 8.0 telemetry API from your Mac\ncurl -s http://127.0.0.1:8080/api/health\n# Expected: {\"ok\":true,\"sysname\":\"QNX\",\"release\":\"8.0.0\",\"machine\":\"QEMU_virt\"}</code></pre></div>\n            <p>You can even talk to your QNX Resource Manager directly over POSIX <code>read</code>/<code>write</code>:</p>\n            <div class=\"code-wrap\"><div class=\"code-head\"><span>zsh</span><button class=\"copy-btn\">Copy</button></div><pre><code>curl -s -X POST http://127.0.0.1:8080/api/devctl -d \"\"</code></pre></div>\n          <div class=\"callout tip\"><strong>Verify Checkpoint</strong><div class=\"code-wrap\"><div class=\"code-head\"><span>Host shell</span><button class=\"copy-btn\">Copy</button></div><pre><code>curl -fsS http://127.0.0.1:8080/api/health</code></pre></div><p>{&quot;ok&quot;:true,&quot;sysname&quot;:&quot;QNX&quot;,&quot;release&quot;:&quot;8.0.0&quot;,&quot;machine&quot;:&quot;QEMU_virt&quot;} (observed on this guest)</p></div>"}, "zh": {"title": "交叉编译并热部署 3 级 IPC 与优先级反转实验", "html": "\n            <p><code>qnx-target/src/ipc_lab_workload.c</code> 在 QNX 8.0 里运行 3 级硬实时同步 IPC 管线（<code>sensor_rt_loop P30 → controller_srv P25 → actuator_srv P20</code>），并用 QNX 原生 <code>ThreadCtl(_NTO_TCTL_RUNMASK, (void *)0x1)</code> 将竞争线程精准绑定到 CPU 0，确保在多核 SMP 虚拟机中也能稳定复现优先级反转与内核提权。</p>\n            <div class=\"code-wrap\"><div class=\"code-head\"><span>zsh（零警告交叉编译并一键部署进 QNX 8.0）</span><button class=\"copy-btn\">Copy</button></div><pre><code>./scripts/build-target.sh\n./scripts/deploy-to-qnx.sh\n\n# 在 macOS 宿主机直接探测真机 QNX 8.0 遥测接口\ncurl -s http://127.0.0.1:8080/api/health\n# 预期输出: {\"ok\":true,\"sysname\":\"QNX\",\"release\":\"8.0.0\",\"machine\":\"QEMU_virt\"}</code></pre></div>\n            <p>也可以直接远程读取我们自定义的 <code>/dev/pulse_scope</code> 设备文件：</p>\n            <div class=\"code-wrap\"><div class=\"code-head\"><span>zsh</span><button class=\"copy-btn\">Copy</button></div><pre><code>curl -s -X POST http://127.0.0.1:8080/api/devctl -d \"\"</code></pre></div>\n          <div class=\"callout tip\"><strong>校验点 / Verify Checkpoint</strong><div class=\"code-wrap\"><div class=\"code-head\"><span>Host shell</span><button class=\"copy-btn\">Copy</button></div><pre><code>curl -fsS http://127.0.0.1:8080/api/health</code></pre></div><p>{&quot;ok&quot;:true,&quot;sysname&quot;:&quot;QNX&quot;,&quot;release&quot;:&quot;8.0.0&quot;,&quot;machine&quot;:&quot;QEMU_virt&quot;} (observed on this guest)</p></div>"}}, {"dur": "3 min", "en": {"title": "Measure E2E Response Time Without Mixing Jitter", "html": "<p>P99 E2E: PI OFF 21,548 µs / PI ON 7,029 µs. Missed cycles: 9/92 and 1/91.</p><p>Captured 2026-11-26T06:51:17.455744Z on QNX 8.0 / QEMU virt-7.2 / aarch64le / TCG. One short run on one host; repeat your own measurements. PI ON P99 wakeup interval jitter was 4,582 µs: this is a different metric, not the E2E deadline counter.</p><p>Start Studio locally, click <strong>Connect QNX</strong>, then <strong>Run A/B</strong>. Each phase applies configuration, waits for CONFIG_APPLIED with the assigned generation, resets, then samples for 3 seconds. Any target error aborts the run; simulation is never silently substituted.</p><div class=\"code-wrap\"><div class=\"code-head\"><span>macOS host</span><button class=\"copy-btn\">Copy</button></div><pre><code>cd studio-ui\nnpm ci\nnpm run dev\n# Open http://localhost:5173 then Connect QNX</code></pre></div><p><code>PS_EVT_E2E_CYCLE</code> alone feeds response-time statistics and the once-per-cycle &gt;5 ms miss counter. <code>PS_EVT_PULSE_TICK</code> feeds absolute deviation of successive wakeup intervals from the timer period. This is not absolute timer-expiry lateness. Mean/P99 use the last 128 samples (nearest-rank percentile); maximum and counters are since reset.</p><p><code>ChannelCreate(0)</code> enables native IPC priority inheritance independently of the mutex protocol switch. Observed effective priority is read from /proc, not painted from a fault toggle.</p><img src=\"../assets/live-pi-off.png\" alt=\"QNX live PI OFF measurement\" style=\"width:100%\"><img src=\"../assets/live-pi-on.png\" alt=\"QNX live PI ON measurement\" style=\"width:100%\"><img src=\"../assets/pi-transition.gif\" alt=\"Actual QNX Studio capture while switching PI OFF to PI ON\" style=\"width:100%\"><p>100 km/h × latency = additional travel during latency only. It is not total braking distance, a vehicle test, a WCET proof or a safety guarantee.</p><div class=\"callout tip\"><strong>Verify Checkpoint</strong><div class=\"code-wrap\"><div class=\"code-head\"><span>Host shell</span><button class=\"copy-btn\">Copy</button></div><pre><code>python3 scripts/capture-qnx-trace.py</code></pre></div><p>Saved ... qnx8-qemu-verified-trace.json; nominal=93, pi-off=92, pi-on=91 in the archived run. Counts vary with timing. Script asserts cycles, P99 and miss counts from original events.</p></div>"}, "zh": {"title": "分开测量 E2E 响应时间与唤醒间隔抖动", "html": "<p>P99 E2E: PI OFF 21,548 µs / PI ON 7,029 µs. Missed cycles: 9/92 and 1/91.</p><p>Captured 2026-11-26T06:51:17.455744Z on QNX 8.0 / QEMU virt-7.2 / aarch64le / TCG. One short run on one host; repeat your own measurements. PI ON P99 wakeup interval jitter was 4,582 µs: this is a different metric, not the E2E deadline counter.</p><p>Start Studio locally, click <strong>Connect QNX</strong>, then <strong>Run A/B</strong>. Each phase applies configuration, waits for CONFIG_APPLIED with the assigned generation, resets, then samples for 3 seconds. Any target error aborts the run; simulation is never silently substituted.</p><div class=\"code-wrap\"><div class=\"code-head\"><span>macOS host</span><button class=\"copy-btn\">Copy</button></div><pre><code>cd studio-ui\nnpm ci\nnpm run dev\n# Open http://localhost:5173 then Connect QNX</code></pre></div><p><code>PS_EVT_E2E_CYCLE</code> alone feeds response-time statistics and the once-per-cycle &gt;5 ms miss counter. <code>PS_EVT_PULSE_TICK</code> feeds absolute deviation of successive wakeup intervals from the timer period. This is not absolute timer-expiry lateness. Mean/P99 use the last 128 samples (nearest-rank percentile); maximum and counters are since reset.</p><p><code>ChannelCreate(0)</code> enables native IPC priority inheritance independently of the mutex protocol switch. Observed effective priority is read from /proc, not painted from a fault toggle.</p><img src=\"../assets/live-pi-off.png\" alt=\"QNX live PI OFF measurement\" style=\"width:100%\"><img src=\"../assets/live-pi-on.png\" alt=\"QNX live PI ON measurement\" style=\"width:100%\"><img src=\"../assets/pi-transition.gif\" alt=\"Actual QNX Studio capture while switching PI OFF to PI ON\" style=\"width:100%\"><p>100 km/h × latency = additional travel during latency only. It is not total braking distance, a vehicle test, a WCET proof or a safety guarantee.</p><div class=\"callout tip\"><strong>校验点 / Verify Checkpoint</strong><div class=\"code-wrap\"><div class=\"code-head\"><span>Host shell</span><button class=\"copy-btn\">Copy</button></div><pre><code>python3 scripts/capture-qnx-trace.py</code></pre></div><p>Saved ... qnx8-qemu-verified-trace.json; nominal=93, pi-off=92, pi-on=91 in the archived run. Counts vary with timing. Script asserts cycles, P99 and miss counts from original events.</p></div>"}}, {"dur": "2 min", "en": {"title": "Battle-Tested Apple Silicon Troubleshooting Matrix", "html": "\n            <p>Bookmark this cheat sheet—every single row below was encountered and resolved on real macOS Apple Silicon + QNX SDP 8.0:</p>\n            <table>\n              <thead><tr><th>Error / Symptom</th><th>Root Cause</th><th>Verified Fix</th></tr></thead>\n              <tbody>\n                <tr><td><code>\"allrepos\" is null</code> in QSC CLI</td><td>Metadata repo not initialized before querying packages</td><td>Run <code>-mirrorBaseline qnx800</code> before <code>-listAccessible</code></td></tr>\n                <tr><td><code>qcc: license check failed</code></td><td><code>/root/.qnx</code> not mounted into Docker build runs</td><td>Pass <code>-v \"$HOME/qnx-env/qnx-dot:/root/.qnx\"</code></td></tr>\n                <tr><td><code>startup-qemu-virt</code> or <code>devb-virtio</code> missing</td><td>Base <code>com.qnx.qnx800</code> excludes QEMU VirtIO BSP</td><td>Install <code>target.qemuvirt</code>, <code>driver.virtio</code>, <code>net.devsvirtio</code></td></tr>\n                <tr><td><code>gic_v3.c:966 -- ASSERT</code> on boot</td><td>Apple HVF GICv3 lacks memory-mapped GICC base</td><td>Boot with <code>-M virt-7.2 -cpu cortex-a76</code> (GICv2)</td></tr>\n                <tr><td><code>Networking not supported</code> on macOS</td><td>Stock <code>runimage</code> expects Linux <code>br0</code></td><td>Use <code>-netdev user,hostfwd=...</code> in <code>run-qemu-macos.sh</code></td></tr>\n                <tr><td><code>scp: dest open ... Failure</code></td><td>QNX returns <code>ETXTBSY</code> overwriting running binary</td><td><code>kill -9</code> + <code>rm -f</code> old binaries before <code>scp</code></td></tr>\n              </tbody>\n            </table>\n            <div class=\"callout tip\">\n              <strong>Congratulations!</strong> You now have a repeatable, zero-hardware QNX 8.0 development &amp; observability workflow on Apple Silicon. Try opening the <a href=\"../\" style=\"color:var(--accent);font-weight:700;\">Live QNX Pulse Studio</a> to explore the verified capture or connect to your local QEMU VM!\n            </div>\n          <div class=\"callout tip\"><strong>Verify Checkpoint</strong><div class=\"code-wrap\"><div class=\"code-head\"><span>Host shell</span><button class=\"copy-btn\">Copy</button></div><pre><code>python3 scripts/smoke-target.py</code></pre></div><p>&quot;result&quot;: &quot;PASS&quot;; split HTTP, rejected incomplete/oversized requests, JSON escaping, system threads. See docs/target-smoke.json for the actual record.</p></div>"}, "zh": {"title": "Apple Silicon + QNX 8.0 实战避坑总表（收藏备用）", "html": "\n            <p>下面每一条错误都在本次真机搭建中真实踩过并彻底解决，直接收藏对照：</p>\n            <table>\n              <thead><tr><th>报错现象</th><th>底层原因</th><th>实测验证解法</th></tr></thead>\n              <tbody>\n                <tr><td>QSC 报错 <code>\"allrepos\" is null</code></td><td>查包前未初始化本地元数据缓存</td><td>先执行 <code>-mirrorBaseline qnx800</code> 再查包/安装</td></tr>\n                <tr><td><code>qcc: license check failed</code></td><td>编译容器未挂载 <code>/root/.qnx</code> 许可目录</td><td>容器启动加 <code>-v \"$HOME/qnx-env/qnx-dot:/root/.qnx\"</code></td></tr>\n                <tr><td>缺少 <code>startup-qemu-virt</code> 或 <code>devb-virtio</code></td><td>基础 <code>com.qnx.qnx800</code> 不含 QEMU 驱动</td><td>补装 <code>target.qemuvirt</code> / <code>driver.virtio</code> / <code>net.devsvirtio</code></td></tr>\n                <tr><td>启动卡死 <code>gic_v3.c:966 ASSERT</code></td><td>Apple HVF 强制 GICv3 且缺内存映射 GICC 基址</td><td>改用 <code>-M virt-7.2 -cpu cortex-a76</code>（GICv2）</td></tr>\n                <tr><td>macOS 提示 <code>Networking not supported</code></td><td>官方脚本依赖 Linux <code>br0</code> 网桥</td><td>用 <code>run-qemu-macos.sh</code> 的用户态 NAT <code>hostfwd</code></td></tr>\n                <tr><td>热部署 <code>scp: dest open Failure</code></td><td>QNX 禁止覆盖正在运行的可执行文件 (<code>ETXTBSY</code>)</td><td>先 <code>kill -9</code> 并 <code>rm -f</code> 旧文件再 <code>scp</code></td></tr>\n              </tbody>\n            </table>\n            <div class=\"callout tip\">\n              <strong>恭喜通关！</strong>你已经拥有一套零硬件、可复现的 Apple Silicon + QNX 8.0 微内核开发与实时观测流水线。现在就去 <a href=\"../?lang=zh\" style=\"color:var(--accent);font-weight:700;\">打开 QNX Pulse Studio 观测台</a> 回放真机 Trace 或直连本机 QEMU 吧！\n            </div>\n          <div class=\"callout tip\"><strong>校验点 / Verify Checkpoint</strong><div class=\"code-wrap\"><div class=\"code-head\"><span>Host shell</span><button class=\"copy-btn\">Copy</button></div><pre><code>python3 scripts/smoke-target.py</code></pre></div><p>&quot;result&quot;: &quot;PASS&quot;; split HTTP, rejected incomplete/oversized requests, JSON escaping, system threads. See docs/target-smoke.json for the actual record.</p></div>"}}];

    let cur = 0;
    let lang = new URLSearchParams(location.search).get('lang') === 'zh' ? 'zh' : 'en';
    const visited = new Set([0]);

    const stepListEl = document.getElementById('step-list');
    const stepContentEl = document.getElementById('step-content');
    const progFillEl = document.getElementById('prog-fill');
    const progCountEl = document.getElementById('prog-count');
    const progLabelEl = document.getElementById('prog-label');
    const stepIndEl = document.getElementById('step-indicator');
    const prevBtn = document.getElementById('btn-prev');
    const nextBtn = document.getElementById('btn-next');
    const langBtn = document.getElementById('btn-lang');
    const themeBtn = document.getElementById('btn-theme');
    const headerTitle = document.getElementById('header-title');

    // Default to dark theme to match Studio aesthetic
    document.documentElement.classList.add('dark');

    function render() {
      visited.add(cur);
      const data = STEPS[cur][lang];
      headerTitle.textContent = lang === 'zh'
        ? '零硬件玩转 QNX 8.0：Apple Silicon + QEMU 微内核 IPC 与资源管理器实战'
        : 'Zero Hardware on Apple Silicon: Build & Visualize QNX 8.0 Microkernel IPC';
      langBtn.textContent = lang === 'en' ? '中文' : 'EN';
      progLabelEl.textContent = lang === 'zh' ? '学习进度' : 'Progress';
      document.querySelector('[data-i18n="openStudio"]').textContent =
        lang === 'zh' ? '打开实时观测台' : 'Open Live Studio';

      stepListEl.innerHTML = STEPS.map((s, idx) => {
        const cls = idx === cur ? 'active' : visited.has(idx) ? 'done' : '';
        const icon = idx !== cur && visited.has(idx) ? '✓' : (idx + 1);
        return `<li class="step-item ${cls}" data-idx="${idx}">
          <span class="step-num">${icon}</span>
          <span>${s[lang].title}</span>
          <span class="step-dur">${s.dur}</span>
        </li>`;
      }).join('');

      stepListEl.querySelectorAll('.step-item').forEach((li) => {
        li.addEventListener('click', () => {
          cur = Number(li.dataset.idx);
          window.scrollTo({ top: 0, behavior: 'smooth' });
          render();
        });
      });

      stepContentEl.innerHTML = `
        <div class="step-kicker">${lang === 'zh' ? `第 ${cur + 1} / ${STEPS.length} 步` : `STEP ${cur + 1} OF ${STEPS.length}`} · ${STEPS[cur].dur}</div>
        <h1>${data.title}</h1>
        ${data.html}
      `;

      // Bind copy buttons
      stepContentEl.querySelectorAll('.copy-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const code = btn.closest('.code-wrap').querySelector('pre').innerText;
          navigator.clipboard?.writeText(code);
          btn.textContent = lang === 'zh' ? '已复制 ✓' : 'Copied ✓';
          setTimeout(() => (btn.textContent = lang === 'zh' ? '复制' : 'Copy'), 1500);
        });
      });

      const pct = Math.round(((cur + 1) / STEPS.length) * 100);
      progFillEl.style.width = pct + '%';
      progCountEl.textContent = `${cur + 1} / ${STEPS.length} · 30–60 min`;
      stepIndEl.textContent = `${cur + 1} / ${STEPS.length}`;
      prevBtn.disabled = cur === 0;
      prevBtn.style.opacity = cur === 0 ? '0.45' : '1';
      prevBtn.textContent = lang === 'zh' ? '← 上一步' : '← Previous';
      nextBtn.textContent = cur === STEPS.length - 1
        ? (lang === 'zh' ? '完成 · 打开观测台 →' : 'Finish · Open Studio →')
        : (lang === 'zh' ? '下一步 →' : 'Next Step →');
    }

    prevBtn.addEventListener('click', () => {
      if (cur > 0) { cur--; window.scrollTo({ top: 0, behavior: 'smooth' }); render(); }
    });
    nextBtn.addEventListener('click', () => {
      if (cur < STEPS.length - 1) { cur++; window.scrollTo({ top: 0, behavior: 'smooth' }); render(); }
      else { window.location.href = lang === 'zh' ? '../?lang=zh' : '../'; }
    });
    langBtn.addEventListener('click', () => {
      lang = lang === 'en' ? 'zh' : 'en';
      render();
    });
    themeBtn.addEventListener('click', () => {
      const dark = document.documentElement.classList.toggle('dark');
      themeBtn.textContent = dark ? '☀️ Light' : '🌙 Dark';
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' && cur < STEPS.length - 1) { cur++; render(); }
      if (e.key === 'ArrowLeft' && cur > 0) { cur--; render(); }
    });
    themeBtn.textContent = '☀️ Light';
    render();
  </script>
</body>
</html>
