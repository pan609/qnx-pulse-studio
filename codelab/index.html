            <h2>Three Critical QSC CLI Gotchas Solved by This Script</h2>
            <ol>
              <li><strong>Persist <code>/root/.qnx</code>:</strong> Always mount <code>-v "$HOME/qnx-env/qnx-dot:/root/.qnx"</code> into every container run, otherwise <code>qcc</code> fails with <code>license check failed</code>.</li>
              <li><strong>Mirror Before Listing:</strong> Running <code>-listAccessible</code> before <code>-mirrorBaseline qnx800</code> crashes with <code>"allrepos" is null</code>.</li>
              <li><strong>Install QEMU VirtIO Packages:</strong> Base <code>com.qnx.qnx800</code> omits <code>startup-qemu-virt</code> and <code>devb-virtio</code>! Our script installs all three required packages automatically:</li>

              <strong>恭喜通关！</strong>你已经拥有一套零硬件、可复现的 Apple Silicon + QNX 8.0 微内核开发与实时观测流水线。现在就去 <a href="../?lang=zh" style="color:var(--accent);font-weight:700;">打开 QNX Pulse Studio 观测台</a> 回放真机 Trace 或直连本机 QEMU 吧！
            </div>
          `
        }
      }
    ];

    let cur = 0;
    let lang = new URLSearchParams(location.search).get('lang') === 'zh' ? 'zh' : 'en';
    const visited = new Set([0]);

    const stepListEl = document.getElementById('step-list');
    const stepContentEl = document.getElementById('step-content');
    const progFillEl = document.getElementById('prog-fill');
    const progCountEl = document.getElementById('prog-count');
    const progLabelEl = document.getElementById('prog-label');
    const stepIndEl = document.getElementById('step-indicator');
    const prevBtn = document.getElementById('btn-prev');
    const nextBtn = document.getElementById('btn-next');
    const langBtn = document.getElementById('btn-lang');
    const themeBtn = document.getElementById('btn-theme');
    const headerTitle = document.getElementById('header-title');

    // Default to dark theme to match Studio aesthetic
    document.documentElement.classList.add('dark');

    function render() {
      visited.add(cur);
      const data = STEPS[cur][lang];
      headerTitle.textContent = lang === 'zh'
        ? '零硬件玩转 QNX 8.0：Apple Silicon + QEMU 微内核 IPC 与资源管理器实战'
        : 'Zero Hardware on Apple Silicon: Build & Visualize QNX 8.0 Microkernel IPC';
      langBtn.textContent = lang === 'en' ? '中文' : 'EN';
      progLabelEl.textContent = lang === 'zh' ? '学习进度' : 'Progress';
      document.querySelector('[data-i18n="openStudio"]').textContent =
        lang === 'zh' ? '打开实时观测台' : 'Open Live Studio';

      stepListEl.innerHTML = STEPS.map((s, idx) => {
        const cls = idx === cur ? 'active' : visited.has(idx) ? 'done' : '';
        const icon = idx !== cur && visited.has(idx) ? '✓' : (idx + 1);
        return `<li class="step-item ${cls}" data-idx="${idx}">
          <span class="step-num">${icon}</span>
          <span>${s[lang].title}</span>
          <span class="step-dur">${s.dur}</span>
        </li>`;
      }).join('');

      stepListEl.querySelectorAll('.step-item').forEach((li) => {
        li.addEventListener('click', () => {
          cur = Number(li.dataset.idx);
          window.scrollTo({ top: 0, behavior: 'smooth' });
          render();
        });
      });

      stepContentEl.innerHTML = `
        <div class="step-kicker">${lang === 'zh' ? `第 ${cur + 1} / ${STEPS.length} 步` : `STEP ${cur + 1} OF ${STEPS.length}`} · ${STEPS[cur].dur}</div>
        <h1>${data.title}</h1>
        ${data.html}
      `;

      // Bind copy buttons
      stepContentEl.querySelectorAll('.copy-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const code = btn.closest('.code-wrap').querySelector('pre').innerText;
          navigator.clipboard?.writeText(code);
          btn.textContent = lang === 'zh' ? '已复制 ✓' : 'Copied ✓';
          setTimeout(() => (btn.textContent = lang === 'zh' ? '复制' : 'Copy'), 1500);
        });
      });

      const pct = Math.round(((cur + 1) / STEPS.length) * 100);
      progFillEl.style.width = pct + '%';
      progCountEl.textContent = `${cur + 1} / ${STEPS.length} · ~25 min`;
      stepIndEl.textContent = `${cur + 1} / ${STEPS.length}`;
      prevBtn.disabled = cur === 0;
      prevBtn.style.opacity = cur === 0 ? '0.45' : '1';
      prevBtn.textContent = lang === 'zh' ? '← 上一步' : '← Previous';
      nextBtn.textContent = cur === STEPS.length - 1
        ? (lang === 'zh' ? '完成 · 打开观测台 →' : 'Finish · Open Studio →')
        : (lang === 'zh' ? '下一步 →' : 'Next Step →');
    }

    prevBtn.addEventListener('click', () => {
      if (cur > 0) { cur--; window.scrollTo({ top: 0, behavior: 'smooth' }); render(); }
    });
    nextBtn.addEventListener('click', () => {
      if (cur < STEPS.length - 1) { cur++; window.scrollTo({ top: 0, behavior: 'smooth' }); render(); }
      else { window.location.href = lang === 'zh' ? '../?lang=zh' : '../'; }
    });
    langBtn.addEventListener('click', () => {
      lang = lang === 'en' ? 'zh' : 'en';
      render();
    });
    themeBtn.addEventListener('click', () => {
      const dark = document.documentElement.classList.toggle('dark');
      themeBtn.textContent = dark ? '☀️ Light' : '🌙 Dark';
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' && cur < STEPS.length - 1) { cur++; render(); }
      if (e.key === 'ArrowLeft' && cur > 0) { cur--; render(); }
    });
    themeBtn.textContent = '☀️ Light';
    render();
  </script>
</body>
</html>
